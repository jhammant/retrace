[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrace-cli"
version = "0.1.0"
description = "A private, on-device rewind for macOS and Windows: capture, search, and scrub back through your day. 100% local, no telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Retrace contributors" }]
keywords = ["macos", "windows", "rewind", "recall", "timeline", "privacy", "on-device", "screen-capture", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=1.2",
    "numpy>=1.26",
    "tomli-w>=1.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "pillow>=10.0",
    # Windows backend (retrace/native/win): Windows OCR via WinRT, UI Automation for
    # browser URLs, and the tray icon. macOS uses the bundled Swift helpers instead.
    "winrt-runtime>=3.0,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0,<4; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.0,<4; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.0,<4; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.0,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0,<4; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Better readable-text extraction for the opt-in page-content backfill. Optional:
# without it, backfill falls back to a stdlib HTML stripper.
backfill = [
    "trafilatura>=1.6",
]

[project.scripts]
retrace = "retrace.cli:main"

[project.urls]
Homepage = "https://github.com/jhammant/retrace"
Repository = "https://github.com/jhammant/retrace"
Issues = "https://github.com/jhammant/retrace/issues"

[tool.hatch.build.targets.wheel]
# retrace/web and retrace/native/swift are subpackages of `retrace`, so their
# non-Python assets (.js/.html/.css/.swift) ship automatically — no force-include.
packages = ["retrace"]

[tool.hatch.build.targets.sdist]
# Keep the sdist lean: ship the package + tests + metadata, not the Remotion
# demo video (20MB), rendered frames, or screenshot assets.
include = [
    "retrace",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "windows_live: drives the real Windows desktop (screen, OCR, windows); set RETRACE_LIVE_TESTS=1",
]

[tool.uv]
# Pin the project interpreter to 3.13 for broad wheel availability while staying modern.
python-preference = "managed"
